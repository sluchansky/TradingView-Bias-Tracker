kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
# Both /api (live trading bot on :8000) and /api2 (analysis-only bot on :8001)
# are served by this same Express process, so the deployment path router must
# forward BOTH prefixes here. Without /api2 listed, /api2/* falls through to the
# static `home` site and renders its SPA 404 page.
# /view is the watch-only, expiring, password-protected shareable dashboard link
# (also served by this Express process at app.use("/view", ...)); it must be
# listed here too or /view/* falls through to the static `home` SPA.
paths = ["/api", "/api2", "/view"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
# Builds both the Express bundle AND installs Flask's Python deps (uv sync),
# since the Flask webhook server runs inside this same production VM.
args = ["bash", "scripts/prod-build.sh"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# Supervisor that runs the Flask webhook server (:8000) + Express proxy (:8080)
# together and restarts the VM if either dies. See scripts/prod-start.sh.
args = ["bash", "scripts/prod-start.sh"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
