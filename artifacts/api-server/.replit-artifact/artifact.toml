kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
# Builds both the Express bundle AND installs Flask's Python deps (uv sync),
# since the Flask webhook server runs inside this same production VM.
args = ["bash", "scripts/prod-build.sh"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# Supervisor that runs the Flask webhook server (:8000) + Express proxy (:8080)
# together and restarts the VM if either dies. See scripts/prod-start.sh.
args = ["bash", "scripts/prod-start.sh"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
